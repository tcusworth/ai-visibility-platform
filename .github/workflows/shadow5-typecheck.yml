name: Shadow5 Typecheck

on:
  push:
    branches:
      - shadow5-persistent-runner

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @ai-visibility/csi-legacy
